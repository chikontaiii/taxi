<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Такси Село — Диспетчер</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav class="nav">
        <a href="index.html">🚕 Заказ</a>
        <a href="driver.html">🚗 Водитель</a>
        <a href="admin.html" class="active">📋 Диспетчер</a>
    </nav>

    <!-- Форма входа -->
    <div class="container" id="loginSection">
        <h2>Вход для диспетчера</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary">Войти</button>
        </form>
        <div id="loginError" class="hidden text-center" style="color:var(--red);"></div>
    </div>

    <!-- Дашборд -->
    <div class="container hidden" id="dashboardSection">
        <h1>Панель диспетчера</h1>

        <section>
            <h2>Водители</h2>
            <div id="driversList"></div>
        </section>

        <section class="mt-20">
            <h2>Заказы</h2>
            <div id="ordersTabs" style="display:flex; gap:10px; margin-bottom:15px;">
                <button class="btn btn-secondary" data-filter="active" style="flex:1;">Активные</button>
                <button class="btn btn-secondary" data-filter="new" style="flex:1;">Новые</button>
                <button class="btn btn-secondary" data-filter="completed" style="flex:1;">Завершённые</button>
            </div>
            <div id="ordersList"></div>
        </section>

        <button id="showCreateOrderBtn" class="btn btn-primary mt-20">Создать заказ вручную</button>

        <!-- Модальное окно -->
        <div id="createOrderModal" class="hidden" style="margin-top:20px;">
            <div class="container">
                <h3>Новый заказ (по телефону)</h3>
                <form id="manualOrderForm">
                    <div class="form-group">
                        <label>Телефон клиента</label>
                        <input type="tel" id="manualClientPhone" required>
                    </div>
                    <div class="form-group">
                        <label>Откуда</label>
                        <input type="text" id="manualPickup" required>
                    </div>
                    <div class="form-group">
                        <label>Куда</label>
                        <input type="text" id="manualDropoff" required>
                    </div>
                    <div class="form-group">
                        <label>Цена</label>
                        <input type="number" id="manualPrice" required>
                    </div>
                    <button type="submit" class="btn btn-success">Создать</button>
                    <button type="button" id="closeModalBtn" class="btn btn-secondary">Отмена</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Тост-контейнер -->
    <div id="toast-container"></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script src="js/firebase-config.js"></script>
    <script src="js/firebase-service.js"></script>
    <script src="js/admin.js"></script>
</body>

</html>
